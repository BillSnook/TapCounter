name: TapCounter
options:
  bundleIdPrefix: com.billsnook
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES

targets:
  TapCounter:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TapCounter
      - path: Shared
    info:
      path: TapCounter/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        CFBundleDisplayName: TapCounter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.billsnook.TapCounter
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: TapCounterWatch
        embed: true

  TapCounterWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: TapCounterWatch
      - path: Shared
    info:
      path: TapCounterWatch/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: TapCounter
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.billsnook.TapCounter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.billsnook.TapCounter.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: false

  TapCounterTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TapCounterTests
      - path: Shared
    dependencies:
      - target: TapCounter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.billsnook.TapCounter.Tests

schemes:
  TapCounter:
    build:
      targets:
        TapCounter: all
        TapCounterTests: [test]
    test:
      targets:
        - TapCounterTests
  TapCounterWatch:
    build:
      targets:
        TapCounterWatch: all

