name: TapCounter
options:
  bundleIdPrefix: com.billsnook
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en

# Loose files shown at the root of the project navigator so they're easy to
# open/edit from within Xcode. They aren't attached to any target/build
# phase -- fileGroups just makes XcodeGen add them to the project browser.
fileGroups:
  - README.md
  - project.yml

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    DEVELOPMENT_TEAM: D84KDEPN2N
    CODE_SIGN_STYLE: Automatic

targets:
  TapCounter:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TapCounter
      - path: Shared
    info:
      path: TapCounter/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        CFBundleDisplayName: TapCounter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.billsnook.TapCounter
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: D84KDEPN2N
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: TapCounterWatch
        embed: true

  TapCounterWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: TapCounterWatch
      - path: Shared
    info:
      path: TapCounterWatch/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: TapCounter
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.billsnook.TapCounter
        # Must stay false: this app only works installed as a companion to
        # the iOS app. Setting it true breaks WCSession's ability to
        # recognize the watch app as this iPhone app's counterpart
        # ("WCSession counterpart app not installed"), even when a watch
        # app is technically present. Pinned here so a stray toggle in
        # Xcode's Signing & Capabilities / General pane (Deployment Info →
        # "Supports Running Without iOS App Installation") gets reverted
        # the next time this file is regenerated instead of silently
        # sticking around.
        WKRunsIndependentlyOfCompanionApp: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.billsnook.TapCounter.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: false
        DEVELOPMENT_TEAM: D84KDEPN2N
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: TapCounterWatchWidget
        embed: true

  TapCounterWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: TapCounterWatchWidget
    info:
      path: TapCounterWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: TapCounter
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.billsnook.TapCounter.watchkitapp.Widget
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: true
        DEVELOPMENT_TEAM: D84KDEPN2N
        CODE_SIGN_STYLE: Automatic

  TapCounterTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TapCounterTests
      - path: Shared
    dependencies:
      - target: TapCounter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.billsnook.TapCounter.Tests
        DEVELOPMENT_TEAM: D84KDEPN2N
        CODE_SIGN_STYLE: Automatic

schemes:
  TapCounter:
    build:
      targets:
        TapCounter: all
        TapCounterTests: [test]
    test:
      targets:
        - TapCounterTests
  TapCounterWatch:
    build:
      targets:
        TapCounterWatch: all
        TapCounterWatchWidget: all
